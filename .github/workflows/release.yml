name: release

# Builds + ships the standalone `hakm` engine binary. The hako-code agent finds
# it on PATH / in ~/.hako/bin and spawns it per turn (`hakm <model.mlf2>
# --chat-stdin`); users can also run it directly. Weights are NOT here — they're
# pulled from huggingface.co/mithraeum/<id>.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

# ── ARCH portability ──
# The engine's SIMD paths are COMPILE-gated (__AVX2__, __FMA__), and on x86 they
# are most of the speed: on an i3-8100 a v2 build decodes sho at 2.7 tok/s and a
# v3 build at 8.3-9.5 (prefill 4x). So x86 ships both:
#   linux: hakm-linux-x86_64 (v2, any CPU) + hakm-linux-x86_64-v3 (Haswell+, 2013);
#          install.sh picks v3 when /proc/cpuinfo has the v3 flags
#   macOS: one universal binary with an x86_64h slice, which macOS itself picks on
#          a Haswell+ Intel Mac (arm64 already gets dotprod: Apple's default is M1)
# -march=native is NEVER used in CI (would SIGILL on older user CPUs). Users
# building locally still get -march=native by default.
jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: "-march=x86-64-v2"
            artifact: hakm-linux-x86_64.tar.gz
            staging: hakm-linux-x86_64
            sha: hakm-linux-x86_64.sha256

          - name: linux-x86_64-v3
            os: ubuntu-latest
            arch: "-march=x86-64-v3"
            artifact: hakm-linux-x86_64-v3.tar.gz
            staging: hakm-linux-x86_64-v3
            sha: hakm-linux-x86_64-v3.sha256

          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: "-march=armv8-a"
            artifact: hakm-linux-arm64.tar.gz
            staging: hakm-linux-arm64
            sha: hakm-linux-arm64.sha256

          - name: macos-universal
            os: macos-latest
            arch: "-arch arm64 -arch x86_64 -arch x86_64h"
            artifact: hakm-macos-universal.tar.gz
            staging: hakm-macos-universal
            sha: hakm-macos-universal.sha256

    steps:
      - uses: actions/checkout@v4

      # ASan/UBSan unit gates on the runner's own CPU, before the release build.
      - name: Test
        run: make test

      - name: Build hakm
        run: |
          make ARCH="${{ matrix.arch }}"
          ./hakm --version 2>/dev/null || ./hakm 2>/dev/null | head -1 || true
          file hakm
          mkdir -p ${{ matrix.staging }}
          cp hakm README.md LICENSE ${{ matrix.staging }}/
          tar czf ${{ matrix.artifact }} ${{ matrix.staging }}
          if command -v sha256sum >/dev/null; then
            (cd ${{ matrix.staging }} && sha256sum hakm > ../${{ matrix.sha }})
          else
            (cd ${{ matrix.staging }} && shasum -a 256 hakm > ../${{ matrix.sha }})
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.sha }}
          if-no-files-found: error

  # Windows has no engine build: the loader uses POSIX mmap (sys/mman.h), which
  # MinGW lacks. Needs an #ifdef _WIN32 mmap shim before it can ship here.
  build-freebsd:
    name: build (freebsd-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y gmake gcc
          run: |
            gmake CC=gcc ARCH="-march=x86-64-v2"
            file hakm
            mkdir -p hakm-freebsd-x86_64
            cp hakm README.md LICENSE hakm-freebsd-x86_64/
            tar czf hakm-freebsd-x86_64.tar.gz hakm-freebsd-x86_64
            (cd hakm-freebsd-x86_64 && printf '%s  hakm\n' "$(sha256 -q hakm)" > ../hakm-freebsd-x86_64.sha256)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-x86_64
          path: |
            hakm-freebsd-x86_64.tar.gz
            hakm-freebsd-x86_64.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: hako engine ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/**/hakm-linux-x86_64.tar.gz
            dist/**/hakm-linux-arm64.tar.gz
            dist/**/hakm-macos-universal.tar.gz
            dist/**/hakm-freebsd-x86_64.tar.gz
            dist/**/*.sha256
